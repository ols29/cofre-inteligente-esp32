<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cofre inteligente: painel de controle</title>
<style>
  * { box-sizing: border-box; margin: 0; }

  body {
    background: #14161a;
    color: #e6e4dd;
    font-family: system-ui, -apple-system, sans-serif;
    padding: 24px;
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.6;
  }

  h1 {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #8a8880;
    margin-bottom: 20px;
  }

  .painel {
    border: 1px solid #2c2f36;
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 16px;
  }

  .estado {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 36px;
    letter-spacing: .06em;
  }

  .aberto     { color: #63c98a; }
  .trancado   { color: #e0a44a; }
  .digitando  { color: #5a9fe0; }
  .bloqueado  { color: #e05a5a; }

  .meta { color: #8a8880; font-size: 13px; margin-top: 8px; }

  .botoes { display: flex; gap: 10px; margin-bottom: 16px; }

  button {
    flex: 1;
    padding: 14px;
    border: 1px solid #2c2f36;
    border-radius: 8px;
    background: #1c1f25;
    color: #e6e4dd;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: border-color .15s;
  }
  button:hover:not(:disabled) { border-color: #4a4e57; }
  button:focus-visible { outline: 2px solid #5a9fe0; outline-offset: 2px; }
  button:disabled { opacity: .35; cursor: not-allowed; }

  h2 {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #8a8880;
    margin-bottom: 12px;
  }

  ul { padding: 0; }

  li {
    list-style: none;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 13px;
    padding: 7px 0;
    border-bottom: 1px solid #22252b;
    display: flex;
    justify-content: space-between;
    color: #b8b6ae;
  }
  li:last-child { border-bottom: none; }

  .vazio { color: #5c5a55; font-family: inherit; }

  .troca { display: flex; gap: 10px; }

  input {
    flex: 1;
    padding: 12px;
    border: 1px solid #2c2f36;
    border-radius: 8px;
    background: #1c1f25;
    color: #e6e4dd;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 15px;
  }
  input:focus-visible { outline: 2px solid #5a9fe0; outline-offset: 2px; }

  .erro { color: #e05a5a; font-size: 13px; margin-top: 8px; min-height: 20px; }
  #conexao { font-size: 12px; color: #8a8880; margin-top: 16px; }
</style>
</head>
<body>

<h1>Cofre inteligente</h1>

<div class="painel">
  <div id="estado" class="estado">--</div>
  <div class="meta" id="meta">Conectando ao ESP32...</div>
</div>

<div class="botoes">
  <button id="btnAbrir">Abrir</button>
  <button id="btnFechar">Fechar</button>
</div>

<div class="painel">
  <h2>Trocar senha do teclado</h2>
  <div class="troca">
    <input id="novaSenha" inputmode="numeric" maxlength="8" placeholder="4 a 8 dígitos">
    <button id="btnSenha" style="flex:0 0 130px">Salvar senha</button>
  </div>
  <div class="erro" id="erroSenha"></div>
</div>

<div class="painel">
  <h2>Registro de eventos</h2>
  <ul id="log"><li class="vazio">Nenhum evento ainda.</li></ul>
</div>

<div id="conexao">Aguardando o servidor</div>

<script src="app.js"></script>
</body>
</html>
