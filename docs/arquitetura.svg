<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
<style>
.bg{fill:#f7f9fc}.title{font:700 30px Arial;fill:#172033}.sub{font:16px Arial;fill:#526078}
.h{font:700 19px Arial;fill:#172033}.b{font:15px Arial;fill:#34425a}.s{font:13px Arial;fill:#526078}
.box{fill:#fff;stroke:#9aa9bd;stroke-width:2}.input{fill:#fff8e8;stroke:#c58a27;stroke-width:2}
.esp{fill:#eaf2ff;stroke:#3267b2;stroke-width:3}.out{fill:#f4efff;stroke:#8062b2;stroke-width:2}
.net{fill:#eef8f2;stroke:#3b8b62;stroke-width:2}.line{fill:none;stroke:#526078;stroke-width:2.5}
.wifi{fill:none;stroke:#3b8b62;stroke-width:3;stroke-dasharray:8 6}
</style>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526078"/></marker>
<marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3b8b62"/></marker>
</defs>
<rect class="bg" width="1400" height="900"/>
<text x="700" y="52" text-anchor="middle" class="title">Vault32 — Diagrama de arquitetura do sistema</text>
<text x="700" y="82" text-anchor="middle" class="sub">Controle de acesso físico com ESP32, autenticação local e interface web em rede Wi-Fi própria</text>

<text x="70" y="145" class="h">ENTRADAS FÍSICAS</text>
<rect x="70" y="170" width="250" height="115" rx="14" class="input"/>
<text x="195" y="207" text-anchor="middle" class="h">Teclado matricial 3×3</text>
<text x="195" y="238" text-anchor="middle" class="b">Entrada de senha</text>
<text x="195" y="262" text-anchor="middle" class="s">Autenticação local</text>
<rect x="70" y="325" width="250" height="115" rx="14" class="input"/>
<text x="195" y="362" text-anchor="middle" class="h">Leitor RFID RC522</text>
<text x="195" y="393" text-anchor="middle" class="b">Leitura de cartão/tag</text>
<text x="195" y="417" text-anchor="middle" class="s">Validação de UID autorizado</text>

<rect x="475" y="170" width="450" height="390" rx="22" class="esp"/>
<text x="700" y="212" text-anchor="middle" class="h">ESP32 — controlador central</text>
<text x="700" y="243" text-anchor="middle" class="b">Firmware em C++ / Arduino IDE</text>
<line x1="515" y1="265" x2="885" y2="265" stroke="#9bb5dc" stroke-width="1.5"/>
<text x="700" y="300" text-anchor="middle" class="h">Lógica de controle de acesso</text>
<text x="700" y="332" text-anchor="middle" class="b">Validação de senha e identificação RFID</text>
<text x="700" y="365" text-anchor="middle" class="b">Estados: FECHADO • ABERTO • BLOQUEADO</text>
<text x="700" y="400" text-anchor="middle" class="b">3 tentativas inválidas → bloqueio por 30 s</text>
<text x="700" y="435" text-anchor="middle" class="b">Abertura temporizada → fechamento após 10 s</text>
<line x1="515" y1="475" x2="885" y2="475" stroke="#9bb5dc" stroke-width="1.5"/>
<text x="700" y="510" text-anchor="middle" class="h">Servidor HTTP — porta 80</text>
<text x="700" y="537" text-anchor="middle" class="s">Interface web e rotas de consulta/controle</text>

<path d="M320 225H420V310H475" class="line" marker-end="url(#a)"/>
<path d="M320 382H400V350H475" class="line" marker-end="url(#a)"/>
<text x="395" y="208" text-anchor="middle" class="s">Senha</text>
<text x="395" y="372" text-anchor="middle" class="s">Dados RFID</text>

<text x="1045" y="145" class="h">ATUADORES E INDICAÇÃO</text>
<rect x="1045" y="170" width="280" height="100" rx="14" class="out"/>
<text x="1185" y="207" text-anchor="middle" class="h">Servo SG90</text>
<text x="1185" y="238" text-anchor="middle" class="b">Acionamento da trava</text>
<rect x="1045" y="300" width="280" height="100" rx="14" class="out"/>
<text x="1185" y="337" text-anchor="middle" class="h">LED</text>
<text x="1185" y="368" text-anchor="middle" class="b">Indicação visual do estado</text>
<rect x="1045" y="430" width="280" height="100" rx="14" class="out"/>
<text x="1185" y="467" text-anchor="middle" class="h">LCD 16×2 I²C</text>
<text x="1185" y="498" text-anchor="middle" class="b">Mensagens e estado do cofre</text>
<path d="M925 245H990V220H1045" class="line" marker-end="url(#a)"/>
<path d="M925 350H1005V350H1045" class="line" marker-end="url(#a)"/>
<path d="M925 445H990V480H1045" class="line" marker-end="url(#a)"/>

<rect x="350" y="625" width="700" height="205" rx="18" class="net"/>
<text x="700" y="660" text-anchor="middle" class="h">COMUNICAÇÃO EM REDE LOCAL</text>
<rect x="395" y="690" width="250" height="100" rx="12" class="box"/>
<text x="520" y="725" text-anchor="middle" class="h">Wi-Fi Access Point</text>
<text x="520" y="753" text-anchor="middle" class="b">SSID: Vault32</text>
<text x="520" y="775" text-anchor="middle" class="s">IP: 192.168.4.1</text>
<rect x="755" y="690" width="250" height="100" rx="12" class="box"/>
<text x="880" y="725" text-anchor="middle" class="h">Celular ou computador</text>
<text x="880" y="753" text-anchor="middle" class="b">Navegador web</text>
<text x="880" y="775" text-anchor="middle" class="s">Interface servida pelo ESP32</text>
<path d="M700 560V595H520V690" class="wifi" marker-end="url(#g)"/>
<path d="M645 740H755" class="wifi" marker-end="url(#g)"/>
<text x="700" y="722" text-anchor="middle" class="s">HTTP</text>
<path d="M880 690V610H925V535" class="wifi" marker-end="url(#g)"/>
<text x="965" y="605" class="s">Requisições</text>
<text x="700" y="865" text-anchor="middle" class="s">Eventos e diagnósticos também são enviados pela comunicação serial (USB / Serial Monitor).</text>
</svg>
